<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"><title>Set up Optics CRM</title><link rel="stylesheet" href="setup.css"></head><body><main><div class="brand-header"><img src="icon.png" alt="Optics CRM Logo" class="brand-logo"><h1>Welcome to Optics CRM</h1></div><p>Set up your shop on this computer. Your records stay here.</p><form id="setup"><label for="shop">Shop name</label><input id="shop" name="shop" required maxlength="255" autocomplete="organization"><label for="name">Owner name</label><input id="name" name="name" required maxlength="255" autocomplete="name"><label for="email">Owner email</label><input id="email" name="email" type="email" required autocomplete="username"><label for="password">Password (at least 10 characters)</label><input id="password" name="password" type="password" required minlength="10" maxlength="72" autocomplete="new-password"><label for="confirm">Confirm password</label><input id="confirm" type="password" required autocomplete="new-password"><p id="status" role="status" aria-live="polite"></p><button type="submit">Create shop & continue</button></form><p class="small">Keep your owner password safe. Make regular backups to a separate drive.</p></main><script src="setup.js"></script></body></html>
