services:
  postgres:
    image: postgres:16-alpine
    container_name: optics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: optics_user
      POSTGRES_PASSWORD: optics_password
      POSTGRES_DB: optics_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: